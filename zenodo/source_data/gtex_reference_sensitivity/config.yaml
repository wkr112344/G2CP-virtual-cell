release: "2025-08-22"

# Paths for the raw GTEx downloads are only needed by steps 00-05 (header checks, aggregation, alignment,
# splits, predictor building). They are not used by steps 06-09, which is what run_all.sh replays from the
# archived intermediate files. Set G2CP_GTEX_RAW to the directory holding the two gzipped GTEx products and
# the sample-attribute table if you want to rerun the upstream steps; leave it unset otherwise.
paths:
  raw_dir: null            # e.g. /data/gtex_v11  (must contain the four files named below)
  gene_tpm_gz: "GTEx_Analysis_2025-08-22_v11_RNASeQCv2.4.3_gene_tpm.gct.gz"
  transcripts_tpm_gz: "GTEx_Analysis_2025-08-22_v11_RSEMv1.3.3_transcripts_tpm.txt.gz"
  sample_attributes: "GTEx_Analysis_v11_Annotations_SampleAttributesDS.txt"
  sample_ids_txt: "gtex_v11_sample_ids.txt"

# Verified expected values (steps 00/01 check these and abort on mismatch)
expected:
  gene_tpm_gz_bytes: 2637294603
  transcripts_tpm_gz_bytes: 5175067764
  gene_tpm_md5: "519aa81dccb0fc05d2ce4c5ac1b8de4c"
  transcripts_tpm_md5: "8b1346ab46afab2ff04f02534b98191f"
  gct_rows: 74628          # number of genes (data rows)
  gct_cols: 19788          # number of sample columns
  transcripts_rows: 385659
  transcripts_sample_cols: 19788

analysis:
  log_transform: "log2_tpm_plus_1"     # main analysis space
  primary_gene_set: "all"              # "all" | "protein_coding"
                                       # the GCT/RSEM products carry no biotype column; the protein-coding
                                       # subset would need gene_biotype_file (ENSG -> biotype tsv), unused here
  gene_biotype_file: null
  strip_gene_version: true             # ENSG00000223972.5 -> ENSG00000223972 before intersecting
  tissue_label: "SMTSD"                # fine-grained tissue (70 classes); "SMTS" for the 31 broad classes
  n_bootstrap: 5000
  split_unit: "donor"                  # split by donor, never by sample
  test_fraction: 0.2
  seed: 20260929
